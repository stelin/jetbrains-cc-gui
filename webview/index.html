<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- CSP: 'unsafe-inline' is required for script-src because Java/JCEF injects JS at runtime
         (sendToJava bridge, clipboard handler, font/language/theme config, console forwarding).
         style-src 'unsafe-inline' is needed for dynamically applied CSS variables and theme styles.
         TODO: Migrate to nonce-based CSP for stronger XSS protection. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-src 'none';" />
    <title>Claude Chat Webview</title>
    <!-- Set theme data-theme attribute immediately before React loads -->
    <!-- Note: Background color is injected as inline style on the HTML tag by Java; only data-theme needs to be set here -->
    <script>
      (function() {
        try {
          var savedTheme = localStorage.getItem('theme');
          var ideTheme = window.__INITIAL_IDE_THEME__;
          var theme;

          if (savedTheme === 'light' || savedTheme === 'dark') {
            // User's explicit theme selection takes priority
            theme = savedTheme;
          } else if (ideTheme === 'light' || ideTheme === 'dark') {
            // Follow IDE mode, using the theme injected by Java
            theme = ideTheme;
          } else {
            // Fallback (should not happen in theory, as Java always injects the theme)
            theme = 'dark';
          }

          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
    <!-- 2026-05-25: window-level inbox for Pair inject_prompt. Java's JBCef
         bridge calls window.onPairInjectPrompt(json) from ActionRouter. If
         the React tree hasn't mounted yet (cold start / webview reload), the
         callback is undefined and the directive is silently lost. This stub
         buffers every payload into __pairInjectInbox; PairProvider drains
         the inbox on mount and replaces the stub with the real handler. The
         stub also handles the unmount path: PairProvider restores the stub
         on cleanup so any push during navigation is buffered for the next
         remount instead of throwing TypeError. -->
    <script>
      (function () {
        if (!window.__pairInjectInbox) {
          window.__pairInjectInbox = [];
        }
        if (typeof window.onPairInjectPrompt !== 'function') {
          window.onPairInjectPrompt = function (json) {
            try {
              window.__pairInjectInbox.push(json);
              if (typeof console !== 'undefined' && console.info) {
                console.info('[INJECT_TRACE] inbox stub buffered payload',
                  { inboxSize: window.__pairInjectInbox.length });
              }
            } catch (e) {
              if (typeof console !== 'undefined' && console.error) {
                console.error('[INJECT_TRACE] inbox stub failed to buffer', e);
              }
            }
          };
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
